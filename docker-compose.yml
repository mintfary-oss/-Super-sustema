# Super Sistema — Docker Compose (CPU вариант)
# Работает на любом компьютере без GPU
#
# Запуск:    docker compose up -d
# Остановка: docker compose down
# Логи:      docker compose logs -f
# Статус:    docker compose ps

services:

  # ─── Ollama — движок AI моделей ───────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: super-sistema-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-1}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-1}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Open WebUI — веб-интерфейс ───────────────────────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:latest
    container_name: super-sistema-webui
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-super-sistema-secret-change-me}
      - WEBUI_AUTH=${WEBUI_AUTH:-false}
      - DEFAULT_MODELS=${DEFAULT_MODELS:-llama3.2:3b}
      - ENABLE_RAG_WEB_SEARCH=${ENABLE_RAG_WEB_SEARCH:-false}
      - ENABLE_IMAGE_GENERATION=${ENABLE_IMAGE_GENERATION:-false}
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      # Open WebUI: проверяем и /health и корневой путь (версии меняют endpoint)
      test: ["CMD", "sh", "-c",
             "curl -sf http://localhost:8080/health || curl -sf http://localhost:8080/ || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 10
      start_period: 120s

# ─── Тома для хранения данных ─────────────────────────────────────────────
volumes:
  ollama_data:
    name: super-sistema-ollama-data
  open_webui_data:
    name: super-sistema-webui-data

# ─── Сеть ─────────────────────────────────────────────────────────────────
networks:
  default:
    name: super-sistema-network
