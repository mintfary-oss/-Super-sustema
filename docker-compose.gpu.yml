# Super Sistema — Docker Compose (NVIDIA GPU вариант + Tesla P100 Panel)
# Требует: NVIDIA GPU + nvidia-container-toolkit
#
# Запуск:    docker compose -f docker-compose.gpu.yml up -d
# Остановка: docker compose -f docker-compose.gpu.yml down
# Логи:      docker compose -f docker-compose.gpu.yml logs -f
#
# Установка nvidia-container-toolkit:
#   sudo bash scripts/setup-tesla-p100.sh
#
# Адреса после запуска:
#   http://localhost:3000  — Ollama (AI чат)
#   http://localhost:8765  — GPU Panel (Tesla P100 мониторинг)

services:

  # ─── Ollama — движок AI моделей с Tesla P100 ─────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: super-sistema-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_KEEP_ALIVE=${OLLAMA_KEEP_ALIVE:-24h}
      - OLLAMA_NUM_PARALLEL=${OLLAMA_NUM_PARALLEL:-2}
      - OLLAMA_MAX_LOADED_MODELS=${OLLAMA_MAX_LOADED_MODELS:-2}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ─── Open WebUI — веб-интерфейс (CUDA вариант) ───────────────────────────
  open-webui:
    image: ghcr.io/open-webui/open-webui:cuda
    container_name: super-sistema-webui
    restart: unless-stopped
    ports:
      - "${WEBUI_PORT:-3000}:8080"
    volumes:
      - open_webui_data:/app/backend/data
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:-super-sistema-secret-change-me}
      - WEBUI_AUTH=${WEBUI_AUTH:-false}
      - DEFAULT_MODELS=${DEFAULT_MODELS:-llama3.1:8b}
      - ENABLE_RAG_WEB_SEARCH=${ENABLE_RAG_WEB_SEARCH:-false}
      - ENABLE_IMAGE_GENERATION=${ENABLE_IMAGE_GENERATION:-false}
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # ─── GPU Panel — мониторинг Tesla P100 (порт 8765) ───────────────────────
  gpu-panel:
    build:
      context: ./gpu-panel
      dockerfile: Dockerfile
    image: super-sistema-gpu-panel:latest
    container_name: super-sistema-gpu-panel
    restart: unless-stopped
    ports:
      - "8765:8765"
    volumes:
      # Shared папка для trigger-файла (watch-gpu.sh читает с хоста)
      - gpu_shared:/shared
    environment:
      - OLLAMA_URL=http://ollama:11434
    # GPU доступ нужен для nvidia-smi внутри контейнера
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu, utility]
    depends_on:
      - ollama
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8765/api/status')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

# ─── Тома ────────────────────────────────────────────────────────────────────
volumes:
  ollama_data:
    name: super-sistema-ollama-data
  open_webui_data:
    name: super-sistema-webui-data
  gpu_shared:
    name: super-sistema-gpu-shared

# ─── Сеть ────────────────────────────────────────────────────────────────────
networks:
  default:
    name: super-sistema-network
