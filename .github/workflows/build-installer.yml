# Super Sistema — GitHub Actions: Сборка Windows .exe установщика
# Запускается при создании тега версии: git tag v1.0.0 && git push --tags

name: Build Windows Installer

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:  # Ручной запуск из GitHub UI

permissions:
  contents: write   # нужно для создания GitHub Release

jobs:
  build-windows-installer:
    name: Compile NSIS → .exe
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install NSIS
        shell: pwsh
        run: |
          choco install nsis -y --no-progress
          # Добавить NSIS в PATH текущей сессии
          $nsisPath = "C:\Program Files (x86)\NSIS"
          echo "$nsisPath" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          Write-Host "NSIS installed to: $nsisPath"

      - name: Verify NSIS
        shell: pwsh
        run: |
          makensis /VERSION
          Write-Host "NSIS is available in PATH"

      - name: Build NSIS installer
        shell: pwsh
        run: |
          makensis installer/setup.nsi
          if (Test-Path "installer/SuperSistema-Setup.exe") {
            $size = (Get-Item "installer/SuperSistema-Setup.exe").length / 1MB
            Write-Host "SUCCESS: SuperSistema-Setup.exe built ($([math]::Round($size, 1)) MB)"
          } else {
            Write-Error "FAILED: SuperSistema-Setup.exe not found after build"
            exit 1
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: SuperSistema-Setup
          path: installer/SuperSistema-Setup.exe
          retention-days: 30

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          name: "Super Sistema ${{ github.ref_name }}"
          body: |
            ## Super Sistema ${{ github.ref_name }}

            ### Установка

            **Windows:** Скачайте `SuperSistema-Setup.exe` и запустите от имени администратора.

            **Linux:**
            ```bash
            git clone https://github.com/mintfary-oss/-Super-sustema.git
            cd -- -Super-sustema
            bash install.sh
            ```

            ### Требования
            - Windows 10+ / Linux (Ubuntu 20.04+, Debian 11+)
            - Docker Desktop (Windows) или Docker Engine (Linux)
            - 8 GB RAM минимум
            - 20 GB свободного места
          files: |
            installer/SuperSistema-Setup.exe
          draft: false
          prerelease: false
